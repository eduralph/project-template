name: template-test

# Runs scripts/init-repo.sh and scripts/repo-settings.py against a fake GitHub, as a new
# project would, and checks the result (.github/template-test/). Only meaningful in the
# template repository: init-repo.sh deletes this workflow and the tests from repos created
# from it.
on:
  pull_request:

permissions:
  contents: read

jobs:
  template-test:
    if: ${{ github.event.repository.is_template }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Run init-repo.sh and repo-settings.py against a fake GitHub
        env:
          # The stub passes license lookups (`gh api licenses/...`) to the real gh.
          GH_TOKEN: ${{ github.token }}
        run: python3 -I -m unittest discover -s .github/template-test -v
