# Weekly version updates. init-repo.sh adds the project's package ecosystem above the
# github-actions entry; add more entries the same way (pip, cargo, npm, gomod, docker).
# Each entry waits 14 days after a release before proposing it (cooldown), so no
# version younger than two weeks lands. Security updates ignore the cooldown.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
